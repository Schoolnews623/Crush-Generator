<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💘 Legenden Crush Generator</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 30px 15px;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 25px;
      max-width: 350px;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.3);
      border: 2px solid #38bdf8;
    }
    h1 {
      color: #38bdf8;
      font-size: 24px;
      margin-bottom: 5px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
    }
    .result-box {
      background: #0f172a;
      padding: 20px;
      border-radius: 15px;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      margin: 20px 0;
      color: #f43f5e;
      border: 2px dashed #f43f5e;
    }
    button {
      background: linear-gradient(135deg, #38bdf8, #8b5cf6);
      color: white;
      border: none;
      padding: 15px 25px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
      transition: transform 0.1s;
    }
    button:active {
      transform: scale(0.95);
    }
    .news-btn {
      display: inline-block;
      margin-top: 25px;
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 10px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      transition: 0.2s;
    }
    .news-btn:hover {
      background: #38bdf8;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>💘 Dein Secret Crush 🔮</h1>
    <p>Finde heraus, wer heimlich in dich verliebt ist!</p>

    <div class="result-box" id="crush">❓ Drücke den Button!</div>

    <button onclick="findCrush()">Crush enthüllen 🎲</button>

    <br>
    <!-- Dein neuer News-Button -->
    <a href="https://schoolnews623.github.io/school-news/" target="_blank" class="news-btn">📰 Oberschule news</a>
  </div>

  <script>
    const crushes = [
      "👴 Olaf Scholz (Er hat deinen Namen leider schon wieder vergessen...)",
      "🇺🇸 Donald Trump (Er baut eine Mauer um dein Herz, HUGE!)",
      "💼 Friedrich Merz (Er lädt dich zur nächsten Vorstandssitzung ein!)",
      "👁️ Momo (Sie starrt dich um 3 Uhr nachts liebevoll an...)",
      "👵 Angela Merkel (Sie macht das Raute-Zeichen für dich! 👐)",
      "🎷 Tadeus Tentakel (Er spielt dir ein romantisches Ständchen auf der Klarinette!)",
      "🥥 Coconut Abi (Der absolute King aus der Pause!)"
    ];

    function findCrush() {
      const box = document.getElementById('crush');
      box.innerText = "🔮 Universum wird durchsucht...";
      setTimeout(() => {
        const random = Math.floor(Math.random() * crushes.length);
        box.innerText = crushes[random];
      }, 400);
    }
  </script>

</body>
</html>
